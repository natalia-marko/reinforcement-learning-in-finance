name: Daily Tech Sniper

on:
  schedule:
    # Runs at 13:30 UTC (9:30 AM EST) every Mon-Fri
    - cron: '30 13 * * 1-5'
  workflow_dispatch: # Button to run manually for testing

jobs:
  trade:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Libraries
      run: |
        pip install yfinance pandas numpy pandas_ta requests stable-baselines3 gymnasium shimmy

    - name: Run Sniper Bot
      env:
        # Set these in GitHub Repo Settings -> Secrets
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python daily_ai_sniper.py
